name: Follow upstream stable and publish RPM

on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the latest stable release (source commit must remain unchanged)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/rpm.yml', 'scripts/**', 'packaging/**']

permissions:
  contents: read

concurrency:
  group: upstream-stable-rpm
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve the latest published stable release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: python3 scripts/plan.py
      - uses: actions/upload-artifact@v6
        if: steps.plan.outputs.should_build == 'true'
        with:
          name: upstream-plan
          path: .plan.json
          include-hidden-files: true
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.should_build == 'true'
    name: RPM (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      CI: 'true'
      DSH_DISTRO_MANAGED: github-rpm
      UPSTREAM_VERSION: ${{ needs.plan.outputs.version }}
      UPSTREAM_SHA: ${{ needs.plan.outputs.source_sha }}
      RPM_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout packaging tools
        uses: actions/checkout@v7
        with:
          path: packager
          persist-credentials: false
      - name: Checkout the exact upstream release commit
        uses: actions/checkout@v7
        with:
          repository: dsh-tauri/deepseek-harness-desktop
          ref: ${{ needs.plan.outputs.source_sha }}
          path: upstream
          persist-credentials: false
      - name: Initialize pinned runtime submodules
        working-directory: upstream
        run: |
          git config submodule.source/deepseek-harness.update none
          git submodule update --init --recursive --depth 1 -- crates/tauri-runtime-electron crates/electron-rs crates/tauri-plugin-notifications
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: upstream/package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/apps/desktop/src-tauri -> target
          shared-key: rpm-${{ matrix.arch }}
          cache-on-failure: true
      - name: Install Linux build and RPM inspection dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y build-essential libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libx11-dev libxtst-dev libdbus-1-dev libbz2-dev rpm cpio binutils libarchive-tools
      - name: Install pinned frontend dependencies
        working-directory: upstream
        run: pnpm install --frozen-lockfile
      - name: Prepare RPM packaging metadata
        run: python3 packager/scripts/prepare_rpm.py upstream "$UPSTREAM_VERSION" packager
      - name: Build RPM from upstream source
        working-directory: upstream
        run: pnpm tauri build --bundles rpm --config "$GITHUB_WORKSPACE/upstream/apps/desktop/src-tauri/.rpm-packaging/tauri.rpm.conf.json"
      - name: Verify package content, architecture, and GLIBC <= 2.35
        run: python3 packager/scripts/verify_rpm.py upstream/apps/desktop/src-tauri/target/release/bundle/rpm "$UPSTREAM_VERSION" "$RPM_ARCH" "$UPSTREAM_SHA" dist
      - name: Verify installation and sandbox permissions on Fedora 43
        run: |
          docker run --rm --volume "$PWD/dist:/packages:ro" fedora:43 bash -euo pipefail -c '
            dnf install -y /packages/*.rpm
            rpm -q dsh-tauri
            ldd /usr/bin/deepseek-harness-desktop > /tmp/native-libs
            cat /tmp/native-libs
            if grep -q "not found" /tmp/native-libs; then exit 1; fi
            helpers=$(find "/usr/lib/DSH Tauri/runtime" -type f -name chrome-sandbox -perm -4000 -user root)
            test -n "$helpers"
          '
      - name: Preserve RPM output when validation fails
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unverified-rpm-${{ matrix.arch }}
          path: upstream/apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v6
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: upstream-plan
          path: .
      - uses: actions/download-artifact@v7
        with:
          pattern: rpm-*
          path: dist
          merge-multiple: true
      - name: Generate checksums and source provenance
        run: python3 scripts/release_files.py .plan.json dist
      - name: Upload and publish a complete RPM release
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "DSH Tauri $RELEASE_TAG RPM" --notes-file dist/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.rpm dist/SHA256SUMS dist/UPSTREAM.json --clobber
          gh release edit "$RELEASE_TAG" --title "DSH Tauri $RELEASE_TAG RPM" --notes-file dist/release-notes.md --draft=false --prerelease=false --latest
